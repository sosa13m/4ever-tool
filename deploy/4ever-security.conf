# Security headers for every page and static file (included by nginx.conf).
# CSP: only this site, the SoundCloud player (radio), Google Fonts and
# SoundCloud artwork are allowed. Inline styles are needed by React.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://w.soundcloud.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.sndcdn.com https://*.soundcloud.com; media-src 'self' blob:; connect-src 'self'; frame-src https://w.soundcloud.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
