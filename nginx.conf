# 4EVERTOOLS — nginx (web container), production setup.
# Serves the built site and forwards /api/ to the FastAPI container.
# In production Caddy sits in front (HTTPS) and talks to this nginx.
#
# This file is a TEMPLATE: the nginx image fills ${API_UPSTREAM} and
# ${TRUSTED_PROXY_CIDR} from environment variables when the container starts
# (defaults in Dockerfile.frontend). nginx's own $variables are left alone.

# Real client IP: trust X-Forwarded-For only when it comes from the private
# Docker network (Caddy) or the host itself. Internet clients can't fake it.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
set_real_ip_from ${TRUSTED_PROXY_CIDR};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Edge rate limit for new conversions (the API has its own limits too).
limit_req_zone $binary_remote_addr zone=convert:10m rate=12r/m;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # 250 MB upload limit + room for the multipart envelope.
  client_max_body_size 260M;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # New conversion (POST). Exact match: status polling below is not limited here.
  location = /api/conversions {
    limit_req zone=convert burst=6 nodelay;
    proxy_pass ${API_UPSTREAM};
    include /etc/nginx/4ever-proxy.conf;
  }

  location /api/ {
    proxy_pass ${API_UPSTREAM};
    include /etc/nginx/4ever-proxy.conf;
  }

  # Your interface WAVs. A missing one answers 204 (empty) instead of 404,
  # so the site quietly uses the built-in synth and the console stays clean.
  location ^~ /audio/sfx/ {
    include /etc/nginx/4ever-security.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =204;
  }

  # Hashed build files never change: cache for a year.
  location ^~ /assets/ {
    include /etc/nginx/4ever-security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Other static files (icons, share image, theme pictures, your WAVs): one day.
  location ~* \.(png|jpg|jpeg|webp|svg|ico|wav|txt|webmanifest)$ {
    include /etc/nginx/4ever-security.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # The app itself: always revalidate so a new release shows up at once.
  location / {
    include /etc/nginx/4ever-security.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
