# 4EVERTOOLS — producción.
#
# Servidor propio (VPS) con HTTPS automático:
#   docker compose -f docker-compose.prod.yml --profile https up -d --build
# Detrás de otro proxy / plataforma que ya da HTTPS (sin Caddy):
#   docker compose -f docker-compose.prod.yml up -d --build   → web en 127.0.0.1:8080
#
# Todo se configura en .env (copia env.production.example).
services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # nginx is the only way in, so the client IP it forwards is trustworthy.
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - conversion_storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_SITE_URL: https://${DOMAIN:-localhost}
    restart: unless-stopped
    # Only reachable from this machine; the internet comes in through Caddy.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  conversion_storage:
  caddy_data:
  caddy_config:
